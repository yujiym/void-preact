name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port:
    name: upstream parity is recorded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:port

  checks:
    name: build, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test --reporter=default --reporter=json --outputFile=artifacts/unit.json
      - if: always()
        run: node tools/ci/test-summary.ts 'Unit tests' artifacts/unit.json

  integration:
    name: upstream contract in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: pnpm build
      - run: pnpm test:integration --reporter=default --reporter=json --outputFile=artifacts/integration.json
      - if: always()
        run: node tools/ci/test-summary.ts 'Browser contract tests' artifacts/integration.json

  packed-consumer:
    name: published tarball works in a fresh app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: vp exec playwright install --with-deps chromium
      - run: node tools/ci/packed-consumer.ts

  comparison:
    name: installed React and Preact behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: pnpm test:comparison:unit
      - run: pnpm test:comparison
      - if: always() && hashFiles('artifacts/comparison/report.md') != ''
        run: cat artifacts/comparison/report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: behavior-comparison
          path: artifacts/comparison/
          if-no-files-found: error
