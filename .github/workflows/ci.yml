name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      windows:
        description: Include Windows development checks.
        type: boolean
        default: false

  workflow_call:
    inputs:
      windows:
        description: Include Windows development checks.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  port:
    name: upstream parity is recorded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:port

  checks:
    name: build, typecheck, unit
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test: windows') || inputs.windows) && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:release
      - run: pnpm test --reporter=default --reporter=json --outputFile=artifacts/unit.json
      - if: always()
        run: node tools/ci/test-summary.ts 'Unit tests' artifacts/unit.json

  integration:
    name: upstream contract in a browser
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test: windows') || inputs.windows) && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: pnpm build
      - run: pnpm test:integration --reporter=default --reporter=json --outputFile=artifacts/integration.json
      - if: always()
        run: node tools/ci/test-summary.ts 'Browser contract tests' artifacts/integration.json

  packed-consumer:
    name: published tarball works in a fresh app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: vp exec playwright install --with-deps chromium
      - run: node tools/ci/packed-consumer.ts

  comparison:
    name: installed React and Preact behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: pnpm test:comparison:unit
      - run: pnpm test:comparison
      - if: always() && hashFiles('artifacts/comparison/report.md') != ''
        run: cat artifacts/comparison/report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: behavior-comparison-${{ github.sha }}
          path: artifacts/comparison/
          if-no-files-found: error
          retention-days: 90

  required:
    name: CI required
    if: always()
    needs: [port, checks, integration, packed-consumer, comparison]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to succeed
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.JOBS); if (Object.values(jobs).some(job => job.result !== "success")) { console.error(jobs); process.exit(1); }'
