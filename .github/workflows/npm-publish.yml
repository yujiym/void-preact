name: npm publish

on:
  push:
    branches: [main]
    paths: [packages/preact/package.json]
  workflow_dispatch:
    inputs:
      notes:
        description: Release changes and migration steps (Markdown). Merging a version bump publishes automatically; use this to recover.
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unpublished:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - id: version
        run: |
          version="$(node -p "require('./packages/preact/package.json').version")"
          if npm view "void-preact@$version" version --json > view.txt 2> error.txt; then
            [ -s view.txt ] && publish=false || publish=true
          elif grep -q E404 error.txt; then
            publish=true
          else
            cat error.txt >&2
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  verify:
    needs: unpublished
    if: github.ref == 'refs/heads/main' && needs.unpublished.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      windows: true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: behavior-comparison-${{ github.sha }}
          path: evidence
      - id: package
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES="${INPUT_NOTES:-$(node tools/ci/release-notes.ts)}"
          export RELEASE_NOTES
          node tools/ci/prepare-release.ts evidence release
      - name: Inspect the tested package
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          tar -tzf "$TARBALL"
          npm publish "$TARBALL" --access public --dry-run
      - name: Require an unused version tag
        env:
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set +e
          git ls-remote --exit-code origin "refs/tags/$TAG"
          status=$?
          set -e
          if [ "$status" != 2 ]; then
            echo 'Expected an unused tag; tag already exists or remote lookup failed.' >&2
            exit 1
          fi
      - name: Publish the tested package using npm trusted publishing
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --access public
      - name: Tag and retain release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release/release-notes.md release/*.tgz release/report.md release/report.json release/SHA256SUMS
